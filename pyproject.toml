[project]
name = "cachy-migrator"
version = "0.2.0"
description = "Safety-first storage migration and CachyOS replacement engine"
requires-python = ">=3.11"
authors = [{name = "Sundry Group Enterprises"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cachy-migrator = "cachy_migrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
